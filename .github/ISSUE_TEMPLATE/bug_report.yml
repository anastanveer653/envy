name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real secrets, master passwords or the contents of `.envy/store.enc`.**
        For security issues, use [private vulnerability reporting](https://github.com/anastanveer653/envy/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: envy version
      description: Output of `envy version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. envy init
        2. envy set FOO
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
